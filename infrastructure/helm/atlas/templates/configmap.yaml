apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atlas.fullname" . }}-config
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
data:
  ATLAS_ENV: {{ .Values.config.atlasEnv | quote }}
  ATLAS_LOG_LEVEL: {{ .Values.config.atlasLogLevel | quote }}
  ATLAS_CORS_ORIGINS: {{ .Values.config.atlasCorsOrigins | quote }}
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  MINIO_BUCKET: {{ .Values.config.minioBucket | quote }}
  MINIO_SECURE: {{ .Values.config.minioSecure | quote }}
  MLFLOW_TRACKING_URI: {{ .Values.config.mlflowTrackingUri | quote }}
