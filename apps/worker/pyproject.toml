[project]
name = "atlas-worker"
version = "0.1.0"
description = "ATLAS asynchronous worker application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-telemetry",
    "celery[redis]>=5.4",
    "pydantic-settings>=2.6",
    "redis>=5.2",
]

[project.scripts]
atlas-worker = "atlas_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_worker"]
