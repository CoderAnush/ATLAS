[project]
name = "atlas-worker"
version = "0.6.0"
description = "ATLAS asynchronous worker application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlas-core",
    "atlas-telemetry",
    "atlas-db",
    "atlas-storage",
    "atlas-identity",
    "atlas-catalog",
    "atlas-profiling",
    "atlas-preparation",
    "atlas-feature-store",
    "celery[redis]>=5.4",
    "minio>=7.2",
    "pydantic-settings>=2.6",
    "redis>=5.2",
]

[project.scripts]
atlas-worker = "atlas_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_worker"]
