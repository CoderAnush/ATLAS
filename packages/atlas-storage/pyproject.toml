[project]
name = "atlas-storage"
version = "0.1.0"
description = "Object storage abstractions for ATLAS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["atlas-core", "minio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_storage"]
