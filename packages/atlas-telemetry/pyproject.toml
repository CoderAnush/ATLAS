[project]
name = "atlas-telemetry"
version = "0.1.0"
description = "Logging, metrics, tracing, and request context for ATLAS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "prometheus-client",
]

[project.optional-dependencies]
fastapi = ["opentelemetry-instrumentation-fastapi"]
otlp = ["opentelemetry-exporter-otlp-proto-http"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_telemetry"]
