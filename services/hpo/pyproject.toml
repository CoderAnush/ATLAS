[project]
name = "atlas-hpo"
version = "0.8.0"
description = "ATLAS hyperparameter optimization engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "atlas-core",
  "atlas-contracts",
  "atlas-db",
  "atlas-storage",
  "atlas-telemetry",
  "atlas-identity",
  "atlas-catalog",
  "atlas-profiling",
  "atlas-feature-store",
  "atlas-modeling",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "optuna>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_hpo"]
