[project]
name = "atlas-modeling"
version = "0.7.0"
description = "ATLAS training engine — deterministic model training, metrics, artifacts, and HITL model approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "atlas-core",
  "atlas-contracts",
  "atlas-db",
  "atlas-storage",
  "atlas-telemetry",
  "atlas-identity",
  "atlas-catalog",
  "atlas-profiling",
  "atlas-feature-store",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_modeling"]
