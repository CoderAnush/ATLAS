[project]
name = "atlas-profiling"
version = "0.4.0"
description = "ATLAS profiling — dataset understanding, EDA, quality, leakage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "atlas-core",
  "atlas-contracts",
  "atlas-db",
  "atlas-storage",
  "atlas-telemetry",
  "atlas-identity",
  "atlas-catalog",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "plotly>=5.22",
  "pyarrow>=17.0",
  "openpyxl>=3.1",
  "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_profiling"]
