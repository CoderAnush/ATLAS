[project]
name = "atlas-identity"
version = "0.2.0"
description = "ATLAS identity, authentication, RBAC, and multi-tenancy bounded context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "atlas-core",
  "atlas-contracts",
  "atlas-db",
  "atlas-telemetry",
  "argon2-cffi>=23.1",
  "PyJWT>=2.9",
  "email-validator>=2.2",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_identity"]
