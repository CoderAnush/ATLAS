[project]
name = "atlas-feature-store"
version = "0.6.0"
description = "ATLAS feature store — generation, selection, offline store, HITL approval, versioned feature matrices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "atlas-core",
  "atlas-contracts",
  "atlas-db",
  "atlas-storage",
  "atlas-telemetry",
  "atlas-identity",
  "atlas-catalog",
  "atlas-profiling",
  "atlas-preparation",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=17.0",
  "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_feature_store"]
