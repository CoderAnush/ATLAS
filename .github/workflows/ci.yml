name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Ruff
        run: |
          uv run ruff check apps packages tests
          uv run ruff format --check apps packages tests
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
        env:
          ATLAS_ENV: testing
          CELERY_TASK_ALWAYS_EAGER: "true"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pnpm install
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t atlas-api:ci .
      - name: Build Worker image
        run: docker build -f infrastructure/docker/Dockerfile.worker -t atlas-worker:ci .
      - name: Build Web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t atlas-web:ci .
