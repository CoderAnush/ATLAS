name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Ruff
        run: |
          uv run ruff check apps packages tests services/hpo agents/hyperparameter_optimization
          uv run ruff format --check apps packages tests services/hpo agents/hyperparameter_optimization
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
        env:
          ATLAS_ENV: testing
          CELERY_TASK_ALWAYS_EAGER: "true"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        working-directory: apps/web
        run: pnpm install
      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Build
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t atlas-api:ci .
      - name: Build Worker image
        run: docker build -f infrastructure/docker/Dockerfile.worker -t atlas-worker:ci .
      - name: Build Web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t atlas-web:ci --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 .
